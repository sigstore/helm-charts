chart-dirs:
  - charts
excluded-charts:
  # Library chart; cannot be installed directly by Helm.
  - common
validate-maintainers: false
remote: origin
target-branch: main
helm-extra-args: "--timeout 1000s"
chart-repos:
  - ingress-nginx=https://kubernetes.github.io/ingress-nginx
  - sigstore=https://sigstore.github.io/helm-charts
