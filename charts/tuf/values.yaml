forceNamespace: ""
imagePullSecrets: []
serviceAccountName: tuf
roleName: tuf
roleBindingName: tuf
fullnameOverride: tuf
enabled: true

deployment:
  name: tuf
  replicas: 1
  registry: ghcr.io
  repository: sigstore/scaffolding/server
  # v0.7.39
  version: sha256:b5b67a4249041249b0ad97651ff57e1f3be1468d79a01a919b39f0a1952a3def
  imagePullPolicy: IfNotPresent
  port: 8080
  readinessProbe:
    httpGet:
      port: 8080
      path: /
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 1
    successThreshold: 1
    failureThreshold: 3
  livenessProbe:
    httpGet:
      port: 8080
      path: /
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 1
    successThreshold: 1
    failureThreshold: 3
  resources: {}
  containerSecurityContext: {}
  securityContext: {}
  podAnnotations: {}
  podLabels: {}
  tolerations: []
  nodeSelector: {}
  affinity: {}
  volumes: []
  volumeMounts: []

secrets:
  rekor:
    create: false
    enabled: true
    name: rekor-public-key
    key: key
    path: rekor.pub
  fulcio:
    create: false
    enabled: true
    name: fulcio-server-secret
    key: cert
    path: fulcio_v1.crt.pem
  ctlog:
    create: false
    enabled: true
    name: ctlog-public-key
    key: public
    path: ctfe.pub
  tsa:
    create: false
    enabled: true
    name: tsa-cert-chain
    key: cert-chain
    path: tsa.certchain.pem

ingress:
  create: true
  name: tuf-server
  className: nginx
  annotations: {}
  http:
    hosts:
    - path: /
      host: "tuf.localhost"

service:
  name: tuf-server
  port: 80

namespace:
  create: false
  name: fulcio-system
