apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ctlog-tiles.fullname" . }}
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "ctlog-tiles.labels" . | nindent 4 }}
{{- if .Values.deploymentAnnotations }}
  annotations:
    {{- toYaml .Values.deploymentAnnotations | nindent 4 }}
{{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "ctlog-tiles.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "ctlog-tiles.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "ctlog-tiles.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ template "ctlog-tiles.image" (dict "image" .Values.image "global" .Values.global) }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
{{ include "ctlog-tiles.args" . | indent 12 }}
          ports:
{{- include "ctlog-tiles.containerPorts" .Values.service.ports | indent 12 }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          lifecycle:
            {{- toYaml .Values.lifecycle | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "k8s.pod.name=$(POD_NAME),k8s.namespace.name=$(POD_NAMESPACE),k8s.container.name={{ .Chart.Name }}"
            {{- if and .Values.server.aws .Values.server.aws.region }}
            - name: AWS_REGION
              value: {{ .Values.server.aws.region | quote }}
            - name: AWS_DEFAULT_REGION
              value: {{ .Values.server.aws.region | quote }}
            {{- end }}
            {{- if and .Values.server.aws .Values.server.aws.s3EndpointURL }}
            - name: AWS_ENDPOINT_URL_S3
              value: {{ .Values.server.aws.s3EndpointURL | quote }}
            {{- end }}
            {{- if and .Values.server.aws .Values.server.aws.credentials .Values.server.aws.credentials.secretKeyRef }}
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.server.aws.credentials.secretKeyRef.name }}
                  key: {{ .Values.server.aws.credentials.secretKeyRef.keys.accessKeyId }}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.server.aws.credentials.secretKeyRef.name }}
                  key: {{ .Values.server.aws.credentials.secretKeyRef.keys.secretAccessKey }}
            {{- if .Values.server.aws.credentials.secretKeyRef.keys.sessionToken }}
            - name: AWS_SESSION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.server.aws.credentials.secretKeyRef.name }}
                  key: {{ .Values.server.aws.credentials.secretKeyRef.keys.sessionToken }}
            {{- end }}
            {{- end }}
            {{- if and .Values.server.aws .Values.server.aws.database .Values.server.aws.database.password .Values.server.aws.database.password.secretKeyRef }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.server.aws.database.password.secretKeyRef.name }}
                  key: {{ .Values.server.aws.database.password.secretKeyRef.key }}
            {{- end }}
            {{- with .Values.server.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
{{- if or ((.Values.server.posix).privateKey).secret ((.Values.server.aws).signer).files (.Values.server.fulcio).configMap (.Values.server.posix).storageDir .Values.server.witnessing }}
          volumeMounts:
{{- end }}
{{- if ((.Values.server.posix).privateKey).secret }}
            - name: {{ .Values.server.posix.privateKey.secret.name }}
              mountPath: {{ (.Values.server.posix.privateKey.secret).mountPath }}
              readOnly: true
{{- end }}
{{- if ((.Values.server.aws).signer).files }}
            - name: {{ printf "%s-aws-signer" (include "ctlog-tiles.fullname" . | trunc 52 | trimSuffix "-") }}
              mountPath: {{ .Values.server.aws.signer.files.secret.mountPath }}
              readOnly: true
{{- end }}
{{- if ((.Values.server.fulcio).configMap) }}
            - name: {{ .Values.server.fulcio.configMap.name }}
              mountPath: {{ .Values.server.fulcio.configMap.mountPath }}
              readOnly: true
{{- end }}
{{- if (.Values.server.posix).storageDir }}
            - name: {{ .Values.server.posix.storageDir.name }}
              mountPath: {{ .Values.server.posix.storageDir.path }}
{{- end }}
{{- if .Values.server.witnessing }}
            - name: witness-config
              mountPath: /etc/witness-config
{{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
{{- if or ((.Values.server.posix).privateKey).secret ((.Values.server.aws).signer).files (.Values.server.fulcio).configMap (.Values.server.posix).storageDir .Values.server.witnessing }}
      volumes:
{{- end }}
{{- if ((.Values.server.posix).privateKey).secret }}
        - name: {{ .Values.server.posix.privateKey.secret.name }}
          secret:
            secretName: {{ .Values.server.posix.privateKey.secret.name }}
            items:
              - key: {{ .Values.server.posix.privateKey.secret.key }}
                path: {{ .Values.server.posix.privateKey.secret.mountSubPath }}
{{- end }}
{{- if ((.Values.server.aws).signer).files }}
        - name: {{ printf "%s-aws-signer" (include "ctlog-tiles.fullname" . | trunc 52 | trimSuffix "-") }}
          secret:
            secretName: {{ .Values.server.aws.signer.files.secret.name }}
            items:
              - key: {{ .Values.server.aws.signer.files.secret.publicKey }}
                path: {{ .Values.server.aws.signer.files.secret.publicKey }}
              - key: {{ .Values.server.aws.signer.files.secret.privateKey }}
                path: {{ .Values.server.aws.signer.files.secret.privateKey }}
{{- end }}
{{- if (.Values.server.fulcio).configMap }}
        - name: {{ .Values.server.fulcio.configMap.name }}
          configMap:
            name: {{ .Values.server.fulcio.configMap.name }}
            items:
              - key: {{ .Values.server.fulcio.configMap.key }}
                path: {{ .Values.server.fulcio.configMap.mountSubPath }}
{{- end }}
{{- if ((.Values.server.posix).storageDir).volume }}
        - name: {{ .Values.server.posix.storageDir.name -}}
          {{- toYaml .Values.server.posix.storageDir.volume | nindent 10 }}
{{- end }}
{{- if .Values.server.witnessing }}
        - name: witness-config
          configMap:
            name: {{ .Values.server.witnessing.configMapName }}
{{- end }}
      {{- if .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      {{- else if eq .Values.image.flavor "gcp" }}
      nodeSelector:
        iam.gke.io/gke-metadata-server-enabled: "true"
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
