# Default values for rekor-tiles.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

# -- Target platform. Only "gke" has any effect: it requires nodeSelector to set the GKE workload-identity
# key (iam.gke.io/gke-metadata-server-enabled). Any other value (e.g. "aws", "posix", "gcpcloudsql")
# is treated identically as non-GKE, and that nodeSelector key is not required.
platform: gke

image:
  flavor: gcp  # Must be gcp, posix, aws, or gcpcloudsql
  registry: ghcr.io
  repository: sigstore/rekor-tiles
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  version: v2.4.0
  # crane digest ghcr.io/sigstore/rekor-tiles/gcp:v2.4.0
  gcpSHA: sha256:c0805be9a9aa3eee06cdac8adb548ea294aaf300bea95859d5f1b14ba32a5448
  # crane digest ghcr.io/sigstore/rekor-tiles/posix:v2.4.0
  posixSHA: sha256:e542a33d707271dafe896c09f9df41bad1412b99c539ecbf4265a50273b1ee05
  # crane digest ghcr.io/sigstore/rekor-tiles/aws:v2.4.0
  awsSHA: sha256:4313836638cde064a84a3bf0ee9108cac3bfee95bdaf6139653f934e25f189e5
  # crane digest ghcr.io/sigstore/rekor-tiles/gcpcloudsql:v2.4.0
  gcpcloudsqlSHA: sha256:41f59339e3671304d71cbf47d741867bd8a3eea8eb651ce63db3d26de37d2547

namespace:
  create: false
  name: rekor-tiles-system

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65533

service:
  type: ClusterIP
  ports:
    - name: 3000-tcp
      port: 80
      protocol: TCP
      targetPort: 3000
    - name: 3001-tcp
      port: 3001
      protocol: TCP
      targetPort: 3001
    - name: metrics
      port: 2112
      protocol: TCP
      targetPort: 2112

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

livenessProbe:
  httpGet:
    path: /healthz
    port: 3000
readinessProbe:
  httpGet:
    path: /healthz
    port: 3000

terminationGracePeriodSeconds: 65
lifecycle:
  preStop:
    sleep:
      seconds: 15

nodeSelector:
  iam.gke.io/gke-metadata-server-enabled: "true"   # support workload identity

tolerations: []

affinity: {}

neg:
  http:
    name: ""
    port: 80
  grpc:
    name: ""
    port: 3001

# Server arguments
server:
  antispam: {}
  tesseraLifecycle: {}
  gcp: {}
    # spanner: projects/{projectId}/instances/{instanceId}/databases/{databaseId}
    # bucket: rekor-tiles-bucket
  gcpcloudsql: {}
    # cloudsqlDsn: user:password@tcp(127.0.0.1:3306)/rekor
    # bucket: rekor-tiles-bucket
  aws: {}
    # bucket: rekor-tiles-bucket
    # mysqlDsn: user:password@tcp(127.0.0.1:3306)/rekor
    # maxOpenConns: 100
    # maxIdleConns: 10
  posix: {}
    # storageDir:
    #   path: /storage
    #   name: ctlog
    #   volume:
    #     hostPath:
    #       path: /data/rekor-tiles-storage
    #       type: Directory
  grpc:
    port: "3001"
  hostname: "localhost"
  http:
    port: "3000"
    metricsPort: "2112"
  serverConfig: {}
  readOnly: false
  grpcSvcTLS: {}
  signer: {}  # posix supports file, gcp supports file, kms, and tink
    # file:
    #   path: /pki/signer.pem
    #   withPassword: false
    #   secret:
    #     name: "signing-key"
    #     key: signing-key
    #     mountPath: /pki
    #     mountSubPath: signer.pem
    # kms:
    #   hash: sha256
    #   key: gcpkms://keyname
    # tink:
    #   kekURI: gcp-kms://keyname
    #   configMapName: tink-config
    #   keyset: ""
  witnessing: {}
    # configMapName: witness-config
    # witnessPolicy: ""
  identity: {}
    # configMapName: oidc-config
    # oidcConfig: ""
  extraArgs: []
  # Additional env vars appended to the container. The chart always sets
  # POD_NAME, K8S_NAMESPACE, and OTEL_RESOURCE_ATTRIBUTES (needed so the
  # GCP OTel metric exporter maps to k8s_container rather than k8s_cluster
  # and each pod gets its own time series). Anything added here is appended.
  extraEnv: []
    # - name: MY_VAR
    #   value: "my-value"
